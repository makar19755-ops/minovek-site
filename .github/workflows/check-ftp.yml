
name: Check Sprinthost connection

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test secure FTPS connection
        env:
          FTP_HOST: ${{ secrets.SPRINTHOST_FTP_HOST }}
          FTP_USER: ${{ secrets.SPRINTHOST_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPRINTHOST_FTP_PASSWORD }}
        run: |
          curl --fail --show-error --silent \
            --ssl-reqd \
            --user "$FTP_USER:$FTP_PASSWORD" \
            --list-only \
            "ftp://$FTP_HOST/public_html/"
